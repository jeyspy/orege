      C 226 274, 214 268, 202 272
      C 190 276, 178 270, 166 274
      C 154 278, 142 272, 130 276
      C 118 280, 106 274, 94 278
      C 82 282, 70 276, 58 280
      C 48 284, 36 278, 26 270

      C 16 262, 8 250, 6 238
