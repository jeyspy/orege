<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" fill="none">
  <!--
    Silhouette Grand Est — forme fidèle à la géographie réelle
    La région s'étend de la Marne/Ardennes (nord-ouest) à l'Alsace (est/Rhin)
    Largeur ~400km, hauteur ~300km
    Repères clefs :
      - Ardennes : nord indentées (frontière Belgique/Luxembourg)
      - Meuse / Moselle : centre-nord
      - Vosges : épine dorsale centre-est
      - Alsace : bande étroite entre Vosges et Rhin (bord droit)
      - Champagne : ouest large et plat
  -->

  <!-- Silhouette principale — remplissage semi-transparent -->
  <path
    fill="rgba(255,255,255,0.08)"
    d="
      M 60 22
      C 72 16, 88 12, 104 10
      C 116 8, 128 14, 140 10
      C 152 6, 164 12, 178 8
      C 192 4, 206 10, 220 8
      C 234 6, 248 14, 260 10
      C 272 6, 285 12, 298 8
      C 308 5, 318 12, 330 10
      C 340 8, 350 16, 362 14
      C 374 12, 386 20, 394 28

      C 398 36, 394 44, 398 52
      C 402 60, 396 68, 400 76
      C 404 84, 398 92, 402 100
      C 406 108, 400 116, 404 124
      C 408 132, 402 140, 406 148
      C 410 156, 404 164, 408 172
      C 412 180, 406 188, 410 196
      C 414 204, 408 212, 412 220
      C 416 228, 410 236, 406 244
      C 400 252, 392 258, 382 262

      C 370 266, 358 260, 346 264
      C 334 268, 322 262, 310 266
      C 298 270, 286 264, 274 268
      C 262 272, 250 266, 238 270
      C 226 274, 214 268, 202 272
      C 190 276, 178 270, 166 274
      C 154 278, 142 272, 130 276
      C 118 280, 106 274, 94 278
