      C 4 226, 10 214, 6 202
      C 2 190, 8 178, 4 166
      C 0 154, 6 142, 2 130
      C -2 118, 4 106, 0 94
      C -4 82, 4 70, 2 58
      C 0 46, 8 34, 18 26
      C 30 18, 46 20, 60 22
      Z
    "
  />

