  <path
    fill="none"
    stroke="rgba(255,255,255,0.16)"
    stroke-width="1.4"
    stroke-linejoin="round"
    stroke-linecap="round"
    d="
      M 60 22
      C 72 16, 88 12, 104 10
      C 116 8, 128 14, 140 10
      C 152 6, 164 12, 178 8
      C 192 4, 206 10, 220 8
      C 234 6, 248 14, 260 10
      C 272 6, 285 12, 298 8
      C 308 5, 318 12, 330 10
      C 340 8, 350 16, 362 14
      C 374 12, 386 20, 394 28

      C 398 36, 394 44, 398 52
      C 402 60, 396 68, 400 76
      C 404 84, 398 92, 402 100
